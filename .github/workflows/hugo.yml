# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  schedule:
    - cron: '30 2 * * *'  # Runs at 5:30 AM Israel time (5:30 AM UTC) every day

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    outputs:
      new_post: ${{ steps.new-posts.outputs.first }}
    env:
      HUGO_VERSION: 0.161.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Detect new posts
        id: new-posts
        # Compares the freshly built index.json with what is live right now. Any
        # permalink that isn't live yet is a new post, so jacob-shore.com/latest
        # (and its Brevo RSS feed) needs a rebuild once this deploy is out.
        run: |
          live=$(curl -fsSL "https://dailyderja.com/index.json" | jq -r '.[].permalink' | sort || true)
          built=$(jq -r '.[].permalink' public/index.json | sort)
          first=$(comm -13 <(echo "$live") <(echo "$built") | head -n 1)
          echo "New post: ${first:-none}"
          echo "first=$first" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Rebuild jacob-shore.com (Cloudflare Pages) so /latest picks up the new post.
  notify-jacob-shore:
    needs: [build, deploy]
    if: needs.build.outputs.new_post != ''
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the new post to be live
        # GitHub Pages' CDN can lag the deploy; poll the same URL Hugo fetches.
        env:
          NEW_POST: ${{ needs.build.outputs.new_post }}
        run: |
          for i in $(seq 1 40); do
            body=$(curl -fsSL "https://dailyderja.com/index.json" || true)
            if grep -qF "$NEW_POST" <<<"$body"; then
              echo "Live: $NEW_POST"; exit 0
            fi
            sleep 15
          done
          echo "::warning::$NEW_POST not visible after 10 minutes; triggering anyway"
      - name: Trigger jacob-shore.com deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.JACOB_SHORE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::JACOB_SHORE_DEPLOY_HOOK secret is not set; skipping"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"
