<style>
/* Prevent Ko-fi floating chat from creating layout scroll/jitter */
#kofi-widget-overlay {
  position: fixed !important;
  inset: 0 !important;
  pointer-events: none !important;
  overflow: visible !important;
  z-index: 9999 !important;
}

#kofi-widget-overlay .floatingchat-container {
  pointer-events: auto !important;
}

#kofi-widget-overlay,
#kofi-widget-overlay * {
  box-sizing: border-box !important;
}

#kofi-widget-overlay iframe,
#kofi-widget-overlay .floatingchat-container {
  margin: 0 !important;
}

html,
body {
  overflow-x: hidden;
}

<script>
  (function () {
    var forms = document.querySelectorAll(".dd-sub form");
    if (!forms.length || !window.fetch || !window.FormData) {
      return; // no JS path: the form posts straight to Brevo
    }

    var MSG_OK = "Almost there: check your inbox and click the confirmation link to get your free ebook.";
    var MSG_ERR = "That didn't go through. Check the address and try again.";

    function track(location, status) {
      // The email address is never sent to GA. "submitted" means Brevo accepted
      // the address; it becomes a subscriber only after the confirmation click
      // (visible in Brevo, and as a page_view of /welcome/ in GA).
      if (typeof window.gtag === "function") {
        window.gtag("event", "newsletter_signup", {
          event_category: "newsletter",
          event_label: location,
          signup_location: location,
          signup_status: status,
          value: status === "submitted" ? 1 : 0,
          transport_type: "beacon"
        });
      }
    }

    forms.forEach(function (form) {
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var container = form.closest(".dd-sub");
        var status = container && container.querySelector(".dd-sub-status");
        var location = container && container.dataset.signupLocation
          ? container.dataset.signupLocation
          : "unknown";
        var button = form.querySelector("button");
        if (button) button.disabled = true;

        function show(text, state) {
          if (!status) return;
          status.textContent = text;
          status.dataset.state = state;
          status.hidden = false;
        }

        fetch(form.action + "?isAjax=1", { method: "POST", body: new FormData(form) })
          .then(function (r) { return r.json().catch(function () { return { success: r.ok }; }); })
          .then(function (res) {
            if (res && res.success) {
              form.hidden = true;
              show(MSG_OK, "ok");
              track(location, "submitted");
            } else {
              show(MSG_ERR, "error");
              track(location, "error");
              if (button) button.disabled = false;
            }
          })
          .catch(function () {
            show(MSG_ERR, "error");
            track(location, "error");
            if (button) button.disabled = false;
          });
      });
    });
  })();
  (function () {
    // Ebook download on /welcome/ (and anywhere else a link carries data-download).
    // Sent by the site so it doesn't depend on GA4's enhanced-measurement setting.
    document.addEventListener("click", function (e) {
      var link = e.target.closest && e.target.closest("a[data-download]");
      if (!link || typeof window.gtag !== "function") {
        return;
      }
      window.gtag("event", "ebook_download", {
        event_category: "newsletter",
        event_label: link.dataset.download,
        file_name: link.dataset.download,
        link_url: link.href,
        transport_type: "beacon"
      });
    });
  })();
  (function () {
    document.addEventListener("click", function (e) {
      var link = e.target.closest && e.target.closest("a[data-channel]");
      if (!link || typeof window.gtag !== "function") {
        return;
      }
      var container = link.closest("[data-signup-location]");
      var location = container ? container.dataset.signupLocation : "unknown";
      window.gtag("event", "channel_click", {
        event_category: "channels",
        event_label: link.dataset.channel,
        channel: link.dataset.channel,
        channel_location: location,
        transport_type: "beacon"
      });
    });
  })();
</script>
<script>
  /* Self-contained image lightbox. Blowfish's body-scroll layout breaks
     medium-zoom (it positions against the window, so the zoomed image lands
     off-screen). We intercept image clicks in the CAPTURE phase — before
     medium-zoom's own per-image listeners — and show a viewport-fixed overlay
     appended to <body>, which is immune to the scroll container. */
  (function () {
    if (window.__ddLightbox) return;
    window.__ddLightbox = true;
    var SEL = ".gallery img, .article-content img:not(.nozoom), figure.dd-cover img";
    var lb, lbImg;
    function build() {
      lb = document.createElement("div");
      lb.className = "dd-lb";
      lb.setAttribute("role", "dialog");
      lb.setAttribute("aria-modal", "true");
      lbImg = document.createElement("img");
      lbImg.alt = "";
      lb.appendChild(lbImg);
      lb.addEventListener("click", close);
      document.body.appendChild(lb);
    }
    function open(src, alt) {
      if (!lb) build();
      lbImg.src = src;
      lbImg.alt = alt || "";
      requestAnimationFrame(function () { lb.classList.add("is-open"); });
    }
    function close() { if (lb) lb.classList.remove("is-open"); }
    document.addEventListener("click", function (e) {
      var t = e.target;
      var img = t && t.closest ? t.closest(SEL) : null;
      if (!img) return;
      e.preventDefault();
      e.stopImmediatePropagation(); /* prevents medium-zoom on the image */
      open(img.currentSrc || img.src, img.alt);
    }, true);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") close();
    });
  })();
</script>
