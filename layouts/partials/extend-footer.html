<style>
/* Prevent Ko-fi floating chat from creating layout scroll/jitter */
#kofi-widget-overlay {
  position: fixed !important;
  inset: 0 !important;
  pointer-events: none !important;
  overflow: visible !important;
  z-index: 9999 !important;
}

#kofi-widget-overlay .floatingchat-container {
  pointer-events: auto !important;
}

#kofi-widget-overlay,
#kofi-widget-overlay * {
  box-sizing: border-box !important;
}

#kofi-widget-overlay iframe,
#kofi-widget-overlay .floatingchat-container {
  margin: 0 !important;
}

html,
body {
  overflow-x: hidden;
}

<script>
  (function () {
    var forms = document.querySelectorAll(".dd-sub form");
    if (!forms.length) {
      return;
    }

    forms.forEach(function (form) {
      form.addEventListener("submit", function () {
        var container = form.closest(".dd-sub");
        var location = container && container.dataset.followitLocation
          ? container.dataset.followitLocation
          : "unknown";

        if (typeof window.gtag === "function") {
          window.gtag("event", "followit_subscribe", {
            event_category: "followit",
            event_label: location,
            followit_location: location,
            value: 1,
            transport_type: "beacon"
          });
        }
      });
    });
  })();
  (function () {
    document.addEventListener("click", function (e) {
      var link = e.target.closest && e.target.closest("a[data-channel]");
      if (!link || typeof window.gtag !== "function") {
        return;
      }
      var container = link.closest("[data-followit-location]");
      var location = container ? container.dataset.followitLocation : "unknown";
      window.gtag("event", "channel_click", {
        event_category: "channels",
        event_label: link.dataset.channel,
        channel: link.dataset.channel,
        channel_location: location,
        transport_type: "beacon"
      });
    });
  })();
</script>
<script>
  /* Self-contained image lightbox. Blowfish's body-scroll layout breaks
     medium-zoom (it positions against the window, so the zoomed image lands
     off-screen). We intercept image clicks in the CAPTURE phase — before
     medium-zoom's own per-image listeners — and show a viewport-fixed overlay
     appended to <body>, which is immune to the scroll container. */
  (function () {
    if (window.__ddLightbox) return;
    window.__ddLightbox = true;
    var SEL = ".gallery img, .article-content img:not(.nozoom), figure.dd-cover img";
    var lb, lbImg;
    function build() {
      lb = document.createElement("div");
      lb.className = "dd-lb";
      lb.setAttribute("role", "dialog");
      lb.setAttribute("aria-modal", "true");
      lbImg = document.createElement("img");
      lbImg.alt = "";
      lb.appendChild(lbImg);
      lb.addEventListener("click", close);
      document.body.appendChild(lb);
    }
    function open(src, alt) {
      if (!lb) build();
      lbImg.src = src;
      lbImg.alt = alt || "";
      requestAnimationFrame(function () { lb.classList.add("is-open"); });
    }
    function close() { if (lb) lb.classList.remove("is-open"); }
    document.addEventListener("click", function (e) {
      var t = e.target;
      var img = t && t.closest ? t.closest(SEL) : null;
      if (!img) return;
      e.preventDefault();
      e.stopImmediatePropagation(); /* prevents medium-zoom on the image */
      open(img.currentSrc || img.src, img.alt);
    }, true);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") close();
    });
  })();
</script>
